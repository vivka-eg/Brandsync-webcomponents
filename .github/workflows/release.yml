name: Release - Version & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-or-publish:
    name: Open Version Packages PR, or publish if none pending
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # changesets/action needs full history to diff which packages changed.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: @changesets/cli calls Node's built-in module.enableCompileCache(),
          # which only exists from Node 22.1.0+ -- confirmed directly via a real CI failure
          # ("enableCompileCache is not a function") on Node 20.20.2.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      # Re-running the full build + test suite here (even though the tagged commit already passed
      # ci.yml on push) is intentional redundancy -- guards against main having moved between the
      # PR merge and this job actually running, not just re-checking the same commit twice.
      - name: Build @brandsync/wc, @brandsync/react, @brandsync/angular
        run: npm run build:all
      - name: Run test suite
        run: npm test

      # If there are unreleased .changeset/*.md files on main, this opens/updates a "Version
      # Packages" PR (running `changeset version` for you -- lockstepped bumps + CHANGELOGs,
      # changeset files consumed) and does NOT publish. Merging that PR is the deliberate human
      # checkpoint. If main has no pending changesets (i.e. that PR was just merged), this instead
      # runs the publish step below.
      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bash scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # react-storybook/angular-storybook are now sibling workspace packages in this SAME repo
      # (previously two separate repos, kept in sync via a cross-repo repository_dispatch + a
      # CROSS_REPO_PAT secret -- that's exactly the class of bug just fixed here: one repo got
      # renamed and only kept working by luck via GitHub's redirect, the other never had an
      # equivalent step at all and silently fell behind). Now that everything lives in one repo,
      # this runs the same scaffold scripts locally, directly against the packages just built by
      # `npm run build:all` above -- no registry install, no cross-repo auth, no PAT needed.
      - name: Scaffold story stubs for newly-released components
        if: steps.changesets.outputs.published == 'true'
        run: |
          node packages/react-storybook/scripts/scaffold-new-stories.js
          node packages/angular-storybook/scripts/scaffold-new-stories.js

      # If neither script above found anything new, `git status` is clean here and there's nothing
      # to open a PR for.
      - name: Check for new story stubs
        id: check
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [ -n "$(git status --porcelain packages/react-storybook/src/stories/ packages/angular-storybook/src/stories/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with new story stubs
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Scaffold story stubs for newly-released components'
          title: 'New component story stubs (needs a human pass)'
          body: |
            A new release added one or more components that didn't have a React and/or Angular
            story yet. This PR adds a minimal boilerplate stub for each (working props table +
            default render via Storybook's `autodocs` tag) -- **it does not add realistic
            args/variants**. See an existing story in the same package for the pattern the real
            stories follow, and flesh these out the same way before merging.
          branch: scaffold-new-stories
          delete-branch: true
