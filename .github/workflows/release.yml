name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets/action needs full history to diff which packages changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @changesets/cli calls Node's built-in module.enableCompileCache(),
          # which only exists from Node 22.1.0+ -- confirmed directly via a real CI failure
          # ("enableCompileCache is not a function") on Node 20.20.2.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Re-running the full build + test suite here (even though the tagged commit already passed
      # ci.yml on push) is intentional redundancy -- guards against main having moved between the
      # PR merge and this job actually running, not just re-checking the same commit twice.
      - run: npm run build:all
      - run: npm test

      # If there are unreleased .changeset/*.md files on main, this opens/updates a "Version
      # Packages" PR (running `changeset version` for you -- lockstepped bumps + CHANGELOGs,
      # changeset files consumed) and does NOT publish. Merging that PR is the deliberate human
      # checkpoint. If main has no pending changesets (i.e. that PR was just merged), this instead
      # runs the publish step below.
      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bash scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tells Brandsync-react's own workflow a new @brandsync/react version just published, so it
      # can scaffold a Storybook stub for any newly-added component -- NOT full story authoring
      # (that still needs a human/follow-up session), just the mechanical "does a stub exist yet"
      # part. Only fires on an actual publish, not on the "opened a Version Packages PR" branch of
      # the changesets/action step above. Needs CROSS_REPO_PAT: the default GITHUB_TOKEN is scoped
      # to this repo only, so reaching another repo's API needs an explicit PAT with `repo` scope
      # for Brandsync-react specifically.
      - name: Notify Brandsync-react of new release
        if: steps.changesets.outputs.published == 'true'
        run: |
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vivka-eg/Brandsync-react/dispatches \
            -d '{"event_type":"wc-published","client_payload":{"published_packages":${{ steps.changesets.outputs.publishedPackages }}}}'
